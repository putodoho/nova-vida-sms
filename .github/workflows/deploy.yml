name: Deploy

# Every merge to main: test, build the API and web images, push them to
# GHCR, then update the VPS over SSH. Can also be started by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}-api
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }},${{ env.API_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }},${{ env.WEB_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VPS (demo)
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://schoolsys.orisystems.site
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/docker-compose.vps.yml,deploy/Caddyfile
          target: /opt/nova-vida
          strip_components: 1
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu
            cd /opt/nova-vida
            test -f .env || { echo "Missing /opt/nova-vida/.env (see docs/deploy-vps.md)"; exit 1; }
            # Remember the deployed version so manual restarts keep it.
            if grep -q '^IMAGE_TAG=' .env; then sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env; else echo "IMAGE_TAG=$IMAGE_TAG" >> .env; fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            C="docker compose -f docker-compose.vps.yml"
            $C pull
            $C up -d --remove-orphans
            # Reference data is idempotent: safe on every deploy.
            $C run --rm --entrypoint /app/cli api seed
            docker logout ghcr.io
            PORT=$(sed -n 's/^APP_PORT=//p' .env); PORT=${PORT:-8088}
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$PORT/api/healthz" >/dev/null 2>&1; then
                echo "healthy: $IMAGE_TAG"; docker image prune -f >/dev/null; exit 0
              fi
              sleep 2
            done
            $C ps; $C logs --tail 50 api; exit 1
