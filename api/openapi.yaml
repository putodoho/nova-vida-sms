openapi: 3.1.0
info:
  title: Nova Vida SMS API
  version: 0.6.0
  description: |
    School management API. Session cookie `nv_session` (set by login).
    Entity-scoped endpoints read header `X-Entity-ID` (a UUID, or `all` / absent on GET).
    Money is integer centavos. Errors use the `Error` schema.
servers:
  - url: /api/v1
security:
  - session: []

paths:
  /auth/login:
    post:
      security: []
      summary: Sign in and receive the session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, description: Email or phone }
                password: { type: string }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: End the current session
      responses:
        "204": { description: Signed out }
  /auth/me:
    get:
      summary: Current user, permissions and accessible entities
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      summary: Change own password (other sessions are ended)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "204": { description: Changed }
        "422": { $ref: "#/components/responses/Error" }
  /permissions:
    get:
      summary: All permissions, for the roles editor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PermissionInfo" } }

  /entities:
    get:
      summary: Entities in the request scope
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Entity" } }
                  total: { type: integer }
  /entities/{id}:
    parameters:
      - { $ref: "#/components/parameters/EntityHeader" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get an entity
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Update an entity (settings.manage; X-Entity-ID must equal id)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntityInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Entity" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /entities/{id}/accounts:
    parameters:
      - { $ref: "#/components/parameters/EntityHeader" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Receiving accounts (cash, bank, M-Pesa, e-Mola)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Account" } }
                  total: { type: integer }
    post:
      summary: Add a receiving account (settings.manage)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /entities/{id}/accounts/{accountId}:
    put:
      summary: Update a receiving account (settings.manage)
      parameters:
        - { $ref: "#/components/parameters/EntityHeader" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }

  /school-years:
    get:
      summary: School years (global)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SchoolYearList" } } } } }
    post:
      summary: Create a school year (settings.manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SchoolYearInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SchoolYear" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /school-years/{id}:
    put:
      summary: Update a school year; months and due day are frozen once charges exist (409 year_has_charges)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SchoolYearInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/SchoolYear" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /levels:
    get:
      summary: Levels of the scoped entities, with penalty rules
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      responses: { "200": { description: OK } }
  /levels/{id}:
    put:
      summary: Update name and penalty rule (settings.manage)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, penalty_rule]
              properties:
                name: { type: string }
                penalty_rule: { $ref: "#/components/schemas/PenaltyRule" }
      responses: { "200": { description: Updated }, "422": { $ref: "#/components/responses/Error" } }

  /classes:
    get:
      summary: Classes of the scoped entities for a year (default open year)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }]
      responses: { "200": { description: OK } }
    post:
      summary: Create a class (settings.manage)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClassInput" } } } }
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /classes/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
    put:
      summary: Update a class (year cannot change; capacity >= enrolled)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClassInput" } } } }
      responses: { "200": { description: Updated }, "422": { $ref: "#/components/responses/Error" } }
    delete:
      summary: Delete a class without enrolments (409 class_in_use)
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/Error" } }

  /fee-items:
    get:
      summary: Fee catalogue for a year, with net/VAT/gross lines
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }]
      responses: { "200": { description: OK } }
    post:
      summary: Create a fee item (settings.manage)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FeeItemInput" } } } }
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /fee-items/{id}:
    put:
      summary: Update a fee item; code, year and kind are fixed. Existing charges keep their snapshot.
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FeeItemInput" } } } }
      responses: { "200": { description: Updated }, "422": { $ref: "#/components/responses/Error" } }
  /fee-items/copy-from-year:
    post:
      summary: Copy the entity's catalogue to another year (classes matched by name, fixed dates shifted)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [from_year, to_year], properties: { from_year: { type: integer }, to_year: { type: integer } } }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { type: object, properties: { copied: { type: integer }, skipped: { type: array, items: { type: string } } } }

  /discount-types:
    get:
      summary: Discount types of the scoped entities
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      responses: { "200": { description: OK } }
    post:
      summary: Create a discount type (settings.manage)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DiscountTypeInput" } } } }
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /discount-types/{id}:
    put:
      summary: Update a discount type (code fixed)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DiscountTypeInput" } } } }
      responses: { "200": { description: Updated }, "422": { $ref: "#/components/responses/Error" } }

  /staff:
    get:
      summary: Staff list (any signed-in user); ?q= search, ?include_inactive=true
      responses: { "200": { description: OK } }
    post:
      summary: Create a staff record (users.manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffInput" } } } }
      responses: { "201": { description: Created } }
  /staff/{id}:
    put:
      summary: Update a staff record (users.manage)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffInput" } } } }
      responses: { "200": { description: Updated } }

  /users:
    get:
      summary: User accounts (users.manage)
      responses: { "200": { description: OK } }
    post:
      summary: Create a user (users.manage); only entities the actor can access may be granted
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } } }
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /users/{id}:
    put:
      summary: Update a user; cannot deactivate self (409 self_deactivate) or remove the last active admin (409 last_admin). Deactivation ends sessions.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } } }
      responses: { "200": { description: Updated }, "409": { $ref: "#/components/responses/Error" } }
  /users/{id}/reset-password:
    post:
      summary: Set a new password and end the user's sessions (users.manage)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, minLength: 8 } } } } }
      responses: { "204": { description: Done } }

  /roles:
    get:
      summary: Roles with permissions and user counts (users.manage)
      responses: { "200": { description: OK } }
    post:
      summary: Create a role (users.manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoleInput" } } } }
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /roles/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      summary: Update a role; the admin role always keeps every permission (409 admin_role_fixed)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoleInput" } } } }
      responses: { "200": { description: Updated }, "409": { $ref: "#/components/responses/Error" } }
    delete:
      summary: Delete a custom role with no users (409 system_role / role_in_use)
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/Error" } }

  /pupils/search:
    get:
      summary: Quick search by name, number or payer phone (pupils.read); max 20, latest enrolment included
      parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2 } }]
      responses: { "200": { description: OK } }
  /pupils:
    post:
      summary: Create a pupil (pupils.write); number NV-<year>-<seq> assigned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PupilInput"
                - type: object
                  properties: { year: { type: integer, description: "Year used in the number; default open year" } }
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /pupils/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: Profile with guardians, pick-up persons, emergency contacts, enrolments; health only with health.read (health_alert always)
      responses: { "200": { description: OK } }
    put:
      summary: Update basic data and status (active/left)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PupilInput" } } } }
      responses: { "200": { description: Updated } }
  /pupils/{id}/health:
    put:
      summary: Replace health record (pupils.write + health.read); audit records only that it changed
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chronic_condition: { type: string }
                allergies: { type: string }
                diet_restrictions: { type: string }
                medication: { type: string }
                doctor_name: { type: string }
                doctor_phone: { type: string }
                notes: { type: string }
                emergency_care_consent: { type: boolean }
      responses: { "200": { description: Updated profile } }
  /pupils/{id}/guardians:
    put:
      summary: Replace guardian links; each item links guardian_id or creates guardian inline; exactly one is_payer
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [relationship]
                properties:
                  guardian_id: { type: string, format: uuid }
                  guardian: { $ref: "#/components/schemas/GuardianInput" }
                  relationship: { type: string, enum: [mother, father, guardian, other] }
                  is_payer: { type: boolean }
                  receives_notices: { type: boolean }
                  may_pick_up: { type: boolean }
                  lives_with: { type: boolean }
      responses: { "200": { description: Updated profile }, "422": { $ref: "#/components/responses/Error" } }
  /pupils/{id}/pickup-persons:
    put:
      summary: Replace authorised pick-up persons (max 10)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { type: object, properties: { full_name: { type: string }, phone: { type: string }, id_doc: { type: string } } } } } } }
      responses: { "200": { description: Updated profile } }
  /pupils/{id}/emergency-contacts:
    put:
      summary: Replace emergency contacts in order (max 5)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { type: object, properties: { full_name: { type: string }, relationship: { type: string }, phone: { type: string } } } } } } }
      responses: { "200": { description: Updated profile } }
  /pupils/{id}/account:
    get:
      summary: Pupil account for a year in the entity scope (charges.read) — charges with derived status and summary (overdue, outstanding, paid, credit)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/Year" }]
      responses: { "200": { description: OK } }

  /guardians:
    get:
      summary: Search guardians by name or phone digits (max 20)
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
    post:
      summary: Create a guardian
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GuardianInput" } } } }
      responses: { "201": { description: Created } }
  /guardians/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: Guardian with children
      responses: { "200": { description: OK } }
    put:
      summary: Update a guardian
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GuardianInput" } } } }
      responses: { "200": { description: Updated } }

  /enrolments:
    get:
      summary: Pupils list — enrolments of a year in scope with payer and (charges.read) overdue/outstanding. Filters year, class_id, status, q, debt=overdue; paginated
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }]
      responses: { "200": { description: OK } }
    post:
      summary: Create a draft enrolment (enrolments.write); mandatory monthly fee of the class is added automatically
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EnrolmentInput" } } } }
      responses: { "201": { description: Draft with totals and charge preview }, "422": { $ref: "#/components/responses/Error" } }
  /enrolments/renew:
    post:
      summary: Bulk returning enrolments into a year; optional services carried by fee code, re_enrolment fee added; per-pupil result
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                school_year_id: { type: string, format: uuid }
                confirm: { type: boolean }
                items: { type: array, items: { type: object, properties: { pupil_id: { type: string, format: uuid }, class_id: { type: string, format: uuid } } } }
      responses: { "200": { description: "{results: [{pupil_id, enrolment_id, status: draft|confirmed|error, error}]}" } }
  /enrolments/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
    get:
      summary: Enrolment with services, totals and (draft) charge preview
      responses: { "200": { description: OK } }
    put:
      summary: Update a draft (409 not_draft)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EnrolmentInput" } } } }
      responses: { "200": { description: Updated } }
    delete:
      summary: Delete a draft
      responses: { "204": { description: Deleted } }
  /enrolments/{id}/confirm:
    post:
      summary: Confirm and generate charges. Requires class, fees_agreement consent, one payer guardian; 409 class_full / already_enrolled / not_draft
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      responses: { "200": { description: Confirmed }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /enrolments/{id}/withdraw:
    post:
      summary: End an enrolment; unpaid charges due after the date are cancelled
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { date: { type: string, format: date }, reason: { type: string } } } } } }
      responses: { "200": { description: Withdrawn } }
  /enrolments/{id}/services:
    put:
      summary: Set optional monthly services from a month (removed → unpaid charges cancelled, 409 charges_paid if any paid; added → charges generated)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [monthly_fee_ids, from_month], properties: { monthly_fee_ids: { type: array, items: { type: string, format: uuid } }, from_month: { type: integer } } } } } }
      responses: { "200": { description: Updated } }

  /payments:
    get:
      summary: Payments in scope (charges.read). Filters from, to, method, receiving_account_id, received_by, pupil_id, status (valid|cancelled), q (receipt, pupil, reference). Includes sum and by_method of valid payments matching the filters.
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      responses: { "200": { description: OK } }
    post:
      summary: Record a payment (payments.create). Allocated oldest first (penalties, then monthly, then one-off on the same day), future charges included; the rest is credit. Receipt number REC[-JI]-<year>-<seq>.
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentInput" } } } }
      responses:
        "201": { description: Payment with allocations and pupil balance after payment }
        "409": { description: "duplicate_reference: same method + reference already registered" }
        "422": { $ref: "#/components/responses/Error" }
  /payments/preview:
    post:
      summary: What a payment of this amount would settle, without writing
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pupil_id, amount], properties: { pupil_id: { type: string, format: uuid }, amount: { type: integer } } } } } }
      responses: { "200": { description: "{open[], allocations[], credit, overdue, outstanding}" } }
  /payments/group:
    post:
      summary: Family payment split between 2–8 children of the same entity; one payment and receipt per child, shared payment_group_id
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, receiving_account_id, splits]
              properties:
                paid_on: { type: string, format: date }
                method: { type: string, enum: [cash, bank, mpesa, emola] }
                receiving_account_id: { type: string, format: uuid }
                reference: { type: string }
                notes: { type: string }
                splits: { type: array, items: { type: object, properties: { pupil_id: { type: string, format: uuid }, amount: { type: integer } } } }
      responses: { "201": { description: Created payments } }
  /payments/{id}:
    get:
      summary: Payment with allocations
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      responses: { "200": { description: OK } }
  /payments/{id}/cancel:
    post:
      summary: Cancel a payment (payments.cancel); keeps the receipt number, deactivates allocations, re-applies other credit
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5 } } } } } }
      responses: { "200": { description: Cancelled }, "409": { description: already_cancelled } }

  /charges:
    get:
      summary: Charges and arrears (charges.read). Filters year, month, class_id, kind, status (open|overdue|paid|cancelled), min_days, q; aging buckets of overdue amounts for the filter
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }]
      responses: { "200": { description: "{items[], total, aging{d1_30, d31_60, d61_90, over_90, total, pupils}}" } }
  /charges/{id}/cancel:
    post:
      summary: Cancel a fee or one-off charge (charges.cancel) with its penalties; money already allocated is re-applied or becomes credit
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { "204": { description: Cancelled }, "409": { description: "wrong_kind / already_cancelled" } }
  /penalties/{id}/waive:
    post:
      summary: Waive a penalty (penalties.waive); a waived penalty is never charged again
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { "204": { description: Waived } }
  /penalties/run:
    post:
      summary: Run the penalty job now for the entities in scope (settings.manage); idempotent. It also runs daily at 01:00 school time.
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      responses: { "200": { description: "{pupils, penalties, amount}" } }

  /discount-requests:
    get:
      summary: Discount requests (charges.read); filters status, enrolment_id; pending ones show the amount approval would grant now
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      responses: { "200": { description: OK } }
    post:
      summary: Request a discount (discounts.request); types without approval are applied at once
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolment_id, discount_type_id, reason]
              properties:
                enrolment_id: { type: string, format: uuid }
                discount_type_id: { type: string, format: uuid }
                mode: { type: string, enum: [percent, fixed], description: "default: the type's" }
                value: { type: integer, description: "default: the type's" }
                from_month: { type: integer, description: "default: enrolment start month" }
                reason: { type: string }
      responses: { "201": { description: Created } }
  /discount-requests/{id}/approve:
    post:
      summary: Approve (discounts.approve); discounts written on unpaid monthly charges of the type's fee codes from from_month. Only admins may decide their own request (409 own_request)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses: { "200": { description: Approved }, "409": { description: already_decided / own_request } }
  /discount-requests/{id}/reject:
    post:
      summary: Reject with a note (discounts.approve)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string } } } } } }
      responses: { "200": { description: Rejected } }

  /payments/{id}/receipt:
    get:
      summary: Receipt (A5) as PDF, or HTML with ?format=html; shows ANULADO when cancelled; amount in words
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/Format" }]
      responses: { "200": { description: application/pdf or text/html }, "502": { description: pdf_unavailable (Gotenberg down) } }
  /statements:
    get:
      summary: Issued statements (charges.read); ?pupil_id=
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      responses: { "200": { description: OK } }
    post:
      summary: Issue a numbered annual statement (documents.generate) for {pupil_id, year}; stored as an immutable snapshot
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pupil_id], properties: { pupil_id: { type: string, format: uuid }, year: { type: integer } } } } } }
      responses: { "201": { description: "{id, number, pupil_id, pupil_name, year, issued_at, issued_by}" } }
  /statements/class:
    post:
      summary: Issue statements for every confirmed pupil of a class; returns one document, one statement per page
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Format" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [class_id], properties: { class_id: { type: string, format: uuid } } } } } }
      responses: { "200": { description: application/pdf or text/html } }
  /statements/{id}:
    get:
      summary: Render a stored statement (A4)
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/Format" }]
      responses: { "200": { description: application/pdf or text/html } }
  /enrolments/{id}/form:
    get:
      summary: Printable enrolment form (A4) with consents and signature lines; health section only with health.read
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/Format" }]
      responses: { "200": { description: application/pdf or text/html } }

  /reports/dashboard:
    get:
      summary: Dashboard (reports.read) — expected and received this month, collection rate, overdue, pupils, month series, payments by method, top overdue accounts, recent payments, pending discounts
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }]
      responses: { "200": { description: OK } }
  /reports/income:
    get:
      summary: Valid payments between from and to grouped by month, method or account
      parameters:
        - { $ref: "#/components/parameters/EntityHeader" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group, in: query, schema: { type: string, enum: [month, method, account] } }
        - { $ref: "#/components/parameters/ReportFormat" }
      responses: { "200": { description: ReportTable or .xlsx, content: { application/json: { schema: { $ref: "#/components/schemas/ReportTable" } } } } }
  /reports/arrears:
    get:
      summary: Per pupil — overdue today, outstanding for the year, days late, payer contact
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { description: ReportTable or .xlsx } }
  /reports/pupils:
    get:
      summary: Per class — capacity, enrolled, new, returning, withdrawn, drafts, occupancy
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { description: ReportTable or .xlsx } }
  /reports/discounts:
    get:
      summary: Approved discounts per pupil and type
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { description: ReportTable or .xlsx } }
  /reports/penalties:
    get:
      summary: Per fee month — penalties charged, paid, waived/cancelled, open
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { description: ReportTable or .xlsx } }
  /reports/vat:
    get:
      summary: Per due month — gross, VAT, net and discounts of non-cancelled charges
      parameters: [{ $ref: "#/components/parameters/EntityHeader" }, { $ref: "#/components/parameters/Year" }, { $ref: "#/components/parameters/ReportFormat" }]
      responses: { "200": { description: ReportTable or .xlsx } }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: nv_session }
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Year:
      name: year
      in: query
      required: false
      schema: { type: integer }
      description: School year (e.g. 2027); default is the open year.
    Format:
      name: format
      in: query
      required: false
      schema: { type: string, enum: [pdf, html] }
      description: pdf (default) or html for on-screen preview / browser printing
    ReportFormat:
      name: format
      in: query
      required: false
      schema: { type: string, enum: [json, xlsx] }
    EntityHeader:
      name: X-Entity-ID
      in: header
      required: false
      schema: { type: string }
      description: Entity UUID; `all` or absent allowed on GET only.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [validation_failed, unauthorized, forbidden, not_found] }
        message: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    Me:
      type: object
      properties:
        today: { type: string, format: date, description: "School's current date (time zone APP_TIMEZONE)" }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            login: { type: string }
            display_name: { type: string }
            roles: { type: array, items: { type: string } }
            permissions: { type: array, items: { type: string } }
            entity_ids: { type: array, items: { type: string, format: uuid } }
        entities:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              code: { type: string, enum: [primary, preschool] }
              short_name: { type: string }
              legal_name: { type: string }
    PermissionInfo:
      type: object
      properties:
        code: { type: string }
        module: { type: string }
        label: { type: string }
    Entity:
      allOf:
        - $ref: "#/components/schemas/EntityInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            logo_path: { type: string }
    EntityInput:
      type: object
      required: [legal_name, short_name, vat_method]
      properties:
        legal_name: { type: string }
        short_name: { type: string }
        nuit: { type: string, pattern: "^[0-9]{9}$" }
        address: { type: string }
        motto: { type: string }
        vat_method: { type: string, enum: [added, included_standard, included_flat] }
    Account:
      allOf:
        - $ref: "#/components/schemas/AccountInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            entity_id: { type: string, format: uuid }
    AccountInput:
      type: object
      required: [kind, label]
      properties:
        kind: { type: string, enum: [cash, bank, mpesa, emola] }
        label: { type: string }
        holder: { type: string }
        number: { type: string }
        nib: { type: string }
        active: { type: boolean }
    SchoolYear:
      allOf:
        - $ref: "#/components/schemas/SchoolYearInput"
        - type: object
          properties: { id: { type: string, format: uuid } }
    SchoolYearList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SchoolYear" } }
        total: { type: integer }
    SchoolYearInput:
      type: object
      required: [year, starts_on, ends_on, billing_months, due_day, status]
      properties:
        year: { type: integer }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        billing_months: { type: array, items: { type: integer, minimum: 1, maximum: 12 } }
        due_day: { type: integer, minimum: 1, maximum: 28 }
        status: { type: string, enum: [planning, open, closed] }
    PenaltyRule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [none, percent, fixed_tiers] }
        rate_bp: { type: integer, description: "percent: basis points of the remaining amount (500 = 5%)" }
        grace_days: { type: integer }
        mode: { type: string, enum: [replace, cumulative] }
        tiers:
          type: array
          items:
            type: object
            properties:
              after_day: { type: integer, description: "Day of month after which the tier applies (5 = from the 6th)" }
              amount: { type: integer, description: centavos }
    ClassInput:
      type: object
      required: [level_id, school_year_id, name, capacity]
      properties:
        level_id: { type: string, format: uuid }
        school_year_id: { type: string, format: uuid }
        name: { type: string }
        grade: { type: [integer, "null"] }
        capacity: { type: integer }
        room: { type: string }
        teacher_staff_id: { type: [string, "null"], format: uuid }
    FeeItemInput:
      type: object
      required: [school_year_id, code, name, kind, amount, vat_mode]
      properties:
        school_year_id: { type: string, format: uuid }
        code: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" }
        name: { type: string }
        kind: { type: string, enum: [monthly, one_off] }
        amount: { type: integer, description: centavos }
        vat_mode: { type: string, enum: [none, included, added] }
        vat_rate_bp: { type: integer }
        due_rule: { type: object, description: "one_off: {date: YYYY-MM-DD} or {on_enrolment: true}; monthly: {}" }
        mandatory: { type: boolean }
        active: { type: boolean }
        class_ids: { type: array, items: { type: string, format: uuid }, description: "Empty = every class" }
    DiscountTypeInput:
      type: object
      required: [code, name, mode, value, fee_item_codes]
      properties:
        code: { type: string }
        name: { type: string }
        mode: { type: string, enum: [percent, fixed] }
        value: { type: integer, description: "basis points (percent) or centavos (fixed)" }
        fee_item_codes: { type: array, items: { type: string } }
        requires_approval: { type: boolean }
        active: { type: boolean }
    StaffInput:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string }
        function: { type: string }
        phone: { type: string }
        email: { type: string }
        active: { type: boolean }
    UserInput:
      type: object
      required: [display_name, role_ids, entity_ids]
      properties:
        login: { type: string, description: "create only; stored lower-case" }
        display_name: { type: string }
        staff_id: { type: [string, "null"], format: uuid }
        password: { type: string, description: create only }
        active: { type: boolean }
        role_ids: { type: array, items: { type: string, format: uuid } }
        entity_ids: { type: array, items: { type: string, format: uuid } }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        code: { type: string, description: create only }
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
    PupilInput:
      type: object
      required: [full_name, sex, birth_date]
      properties:
        full_name: { type: string }
        sex: { type: string, enum: [F, M] }
        birth_date: { type: string, format: date }
        neighbourhood: { type: string }
        religion: { type: string }
        orphan: { type: string, enum: [none, father, mother, both] }
        home_discipline_notes: { type: string }
        status: { type: string, enum: [active, left], description: update only }
    GuardianInput:
      type: object
      required: [full_name, phone1]
      properties:
        full_name: { type: string }
        phone1: { type: string }
        phone2: { type: string }
        email: { type: string }
        neighbourhood: { type: string }
        id_doc: { type: string }
    EnrolmentInput:
      type: object
      required: [pupil_id, school_year_id, type]
      properties:
        pupil_id: { type: string, format: uuid }
        school_year_id: { type: string, format: uuid }
        class_id: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [new, returning] }
        start_month: { type: integer, description: "First billing month; default first month of the calendar" }
        monthly_fee_ids: { type: array, items: { type: string, format: uuid } }
        one_off_fee_ids: { type: array, items: { type: string, format: uuid } }
        consents:
          type: object
          properties:
            image_use: { type: boolean }
            fees_agreement: { type: boolean }
            uniform_books: { type: boolean }
            emergency_care: { type: boolean }
    PaymentInput:
      type: object
      required: [pupil_id, amount, method, receiving_account_id]
      properties:
        pupil_id: { type: string, format: uuid }
        amount: { type: integer, description: centavos }
        paid_on: { type: string, format: date, description: "default today; not in the future, max one year back" }
        method: { type: string, enum: [cash, bank, mpesa, emola] }
        receiving_account_id: { type: string, format: uuid, description: "must match the method" }
        reference: { type: string, description: "required unless cash" }
        notes: { type: string }
    ReportTable:
      type: object
      properties:
        title: { type: string }
        columns:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, int, money, date, percent] }
        rows: { type: array, items: { type: array, items: {} } }
        totals: { type: array, items: {} }
