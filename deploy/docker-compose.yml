# Nova Vida SMS — production-like stack.
# Usage: cp .env.example .env && docker compose up -d --build
name: nova-vida-sms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novavida
      POSTGRES_USER: novavida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Africa/Maputo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novavida -d novavida"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://novavida:${POSTGRES_PASSWORD}@postgres:5432/novavida?sslmode=disable
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL: ${SESSION_TTL:-12h}
      GOTENBERG_URL: http://gotenberg:3000
      FILES_DIR: /data/files
      APP_TIMEZONE: Africa/Maputo
    volumes:
      - files:/data/files

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true", "--api-timeout=60s"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
