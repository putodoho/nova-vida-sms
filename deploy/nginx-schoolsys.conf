# /etc/nginx/sites-available/schoolsys.orisystems.site
# Then: ln -s ../sites-available/schoolsys.orisystems.site /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx && certbot --nginx -d schoolsys.orisystems.site
server {
    listen 80;
    listen [::]:80;
    server_name schoolsys.orisystems.site;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
