# Nova Vida SMS on a VPS behind an existing Nginx (TLS terminates in Nginx).
# Images come from GHCR; the Deploy workflow sets IMAGE_TAG in .env.
# The app listens only on 127.0.0.1:${APP_PORT} — Nginx proxies the domain to it.
name: nova-vida

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novavida
      POSTGRES_USER: novavida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Africa/Maputo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novavida -d novavida"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/putodoho/nova-vida-sms-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://novavida:${POSTGRES_PASSWORD}@postgres:5432/novavida?sslmode=disable
      COOKIE_SECURE: "true"
      SESSION_TTL: ${SESSION_TTL:-12h}
      GOTENBERG_URL: http://gotenberg:3000
      FILES_DIR: /data/files
      APP_TIMEZONE: Africa/Maputo
      FAKE_TODAY: ${FAKE_TODAY:-}
    volumes:
      - files:/data/files

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true", "--api-timeout=60s"]

  web:
    image: ghcr.io/putodoho/nova-vida-sms-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  files:
  caddy_data:
