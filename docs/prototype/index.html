function render(){if(currentPage==='guardian-profile'){$('#content').innerHTML=guardianProfile();return;}let pages={dashboard,alunos,perfil:profile,enrolment:enrolment,matriculas,encarregados,pagamentos,dividas,descontos,documentos,turmas,relatorios,funcionarios,configuracoes,auditoria,renovacao,login};$('#content').innerHTML=(pages[currentPage]||dashboard)();$$('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));bindDynamic();}

function bindDynamic(){$$('[data-open-pupil]').forEach(b=>b.addEventListener('click',()=>{profileId=b.dataset.openPupil;profileTab='Resumo';navigate('perfil')}));$$('.pupil-row').forEach(r=>r.addEventListener('dblclick',()=>{profileId=r.dataset.pupil;navigate('perfil')}));$$('[data-profile-tab]').forEach(b=>b.addEventListener('click',()=>{profileTab=b.dataset.profileTab;render()}));$$('[data-settings-tab]').forEach(b=>b.addEventListener('click',()=>{settingsTab=b.dataset.settingsTab;render()}));$$('[data-print-receipt]').forEach(b=>b.addEventListener('click',()=>openPrint('receipt',b.dataset.printReceipt)));$('#pupilFilter')?.addEventListener('input',filterPupils);$('#levelFilter')?.addEventListener('change',filterPupils);$('#debtFilter')?.addEventListener('change',filterPupils);}
function filterPupils(){let q=($('#pupilFilter')?.value||'').toLowerCase(),lvl=$('#levelFilter')?.value||'',debt=$('#debtFilter')?.value||'';let list=pupils.filter(p=>(entity==='All'||p.entity===entity)&&(!q||(p.name+' '+p.number+' '+p.guardian).toLowerCase().includes(q))&&(!lvl||p.class===lvl)&&(!debt||(debt==='debt'?p.balance>0:p.balance===0)));$('#pupilTable tbody').innerHTML=pupilRows(list);bindDynamic();}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(title,sub,body,foot='',narrow=false){$('#modal').classList.toggle('narrow',narrow);$('#modalTitle').textContent=title;$('#modalSub').textContent=sub||'';$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;$('#modalBackdrop').classList.add('open');}
function closeModal(){$('#modalBackdrop').classList.remove('open');$('#modal').classList.remove('printing')}
$('#modalClose').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function openPayment(id){paymentContext=id||'normal';paymentStep='form';let p=pupils.find(x=>x.id===id)||pupils[0];let candidates=pupils.filter(x=>entity==='All'||x.entity===entity);openModal('Registar pagamento','O pagamento é lançado na conta do aluno, não num mês específico.',paymentForm(p,candidates),`<span class="muted" style="font-size:10px">Campos com * são obrigatórios</span><button class="btn btn-primary" onclick="confirmPayment()">Confirmar pagamento →</button>`);}
function paymentForm(p,candidates){return `<div class="form-grid"><div class="field full"><label>Pesquisar aluno ou encarregado <span class="required">*</span></label><select id="payPupil" onchange="refreshPaymentAllocation()">${candidates.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name} · ${x.class} · Saldo ${money(x.balance)}</option>`).join('')}</select><span class="hint">Pode pesquisar pelo nome, número ou telefone.</span></div><div class="field"><label>Valor recebido (MT) <span class="required">*</span></label><input id="payAmount" type="number" min="0.01" step="0.01" value="3000" oninput="refreshPaymentAllocation()"></div><div class="field"><label>Data do pagamento</label><input id="payDate" type="date" value="2027-05-10"></div><div class="field"><label>Método de pagamento <span class="required">*</span></label><select id="payMethod" onchange="updatePayAccount()"><option>Numerário</option><option>Millennium BIM</option><option>M-Pesa</option><option>e-Mola</option></select></div><div class="field"><label>Conta de recebimento</label><select id="payAccount"><option>Caixa da secretaria</option></select></div><div class="field full"><label>Referência / ID da transacção</label><input id="payReference" placeholder="Obrigatório para BIM, M-Pesa e e-Mola"></div><div class="field full"><label>Observações</label><textarea id="payNotes" placeholder="Notas internas (opcional)"></textarea></div></div><div class="allocation" id="allocationBox">${allocationHTML(p,3000)}</div><div class="section-note">A pré-visualização distribui o valor pelos itens em aberto por ordem de antiguidade: multas primeiro, depois mensalidades e outros encargos.</div>`}
function allocationHTML(p,amount){let remain=Number(amount)||0;let due=p.balance||0;let rows=[];if(due>0){let penalty=p.id==='lucia'?265:0;if(penalty&&remain>0){let a=Math.min(remain,penalty);rows.push(['Multa · Maio',a]);remain-=a;}if(remain>0){let a=Math.min(remain,Math.max(0,due-penalty));rows.push(['Mensalidades em aberto',a]);remain-=a;}}return `<div class="allocation-head"><span>Pré-visualização da alocação</span><span>Saldo: ${money(p.balance)}</span></div>${rows.length?rows.map(r=>`<div class="allocation-row"><span>${r[0]}</span><b>${money(r[1])}</b></div>`).join(''):'<div class="allocation-row"><span>Sem itens em aberto para alocar</span><b>—</b></div>'}<div class="allocation-row" style="background:#f8fafc"><span>Crédito remanescente</span><b style="color:${remain>0?'#16845b':'#42566d'}">${money(remain)}</b></div><div class="allocation-row"><span>Saldo após pagamento (estimado)</span><b>${money(Math.max(0,due-(Number(amount)||0)))}</b></div>`}
function refreshPaymentAllocation(){let p=pupils.find(x=>x.id===$('#payPupil')?.value)||pupils[0],a=Number($('#payAmount')?.value||0);$('#allocationBox').innerHTML=allocationHTML(p,a)}
function updatePayAccount(){let m=$('#payMethod').value,opts=m==='Numerário'?['Caixa da secretaria']:m==='Millennium BIM'?['Millennium BIM · Conta 0001']:m==='M-Pesa'?['M-Pesa · 84 000 0000']:['e-Mola · 86 000 0000'];$('#payAccount').innerHTML=opts.map(o=>`<option>${o}</option>`).join('')}
function confirmPayment(){let p=pupils.find(x=>x.id===$('#payPupil').value)||pupils[0],amount=Number($('#payAmount').value),method=$('#payMethod').value,ref=$('#payReference').value.trim();if(!amount||amount<=0){toast('Introduza um valor válido.');return;}if(method!=='Numerário'&&!ref){toast('Introduza a referência da transacção.');$('#payReference').focus();return;}let n='REC-2027-00418';payments.unshift({date:'10/05/2027',receipt:n,pupil:p.name,guardian:p.guardian,amount,method,account:$('#payAccount').value,reference:ref||'—',received:'Ana Mucavele',status:'Válido'});p.balance=Math.max(0,p.balance-amount);openModal('Pagamento registado','A conta do aluno foi actualizada e o recibo foi emitido.',`<div class="success"><div class="success-mark">✓</div><h3>Pagamento confirmado</h3><p>O recebimento foi registado com sucesso.</p><div class="receipt-number">${n}</div><p style="margin-top:7px">${p.name} · ${money(amount)}</p><div class="summary-box" style="text-align:left;margin-top:15px"><div class="summary-row"><span>Método</span><strong>${method}</strong></div><div class="summary-row"><span>Referência</span><strong>${ref||'—'}</strong></div><div class="summary-row"><span>Saldo após pagamento</span><strong>${money(p.balance)}</strong></div></div></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Fechar</button><div style="display:flex;gap:7px"><button class="btn btn-secondary" onclick="openPrint('receipt','${n}')">Imprimir recibo</button><button class="btn btn-primary" onclick="openPayment()">Registar outro</button></div>`);}

function updateEnrolTotal(){let pre=($('#enrolEntity')?.value||enrolData.entity)==='Preschool',base=pre?3000:($('#enrolLevel')?.value||enrolData.level)==='4.ª classe'?3000:2800,optional=(($('#extraToggle')?.checked??enrolData.extra)?1000:0)+(( $('#lunchToggle')?.checked??enrolData.lunch)?1500:0);$('#baseFee').textContent=money(base);$('#optionalFee').textContent=money(optional);$('#monthlyTotal').textContent=money(base+optional);$('#annualTotal').textContent=money((base+optional)*10)}
function completeEnrol(pay){let name=enrolData.name||$('#enrolName')?.value||'Novo aluno';let isPre=enrolData.entity==='Preschool',base=isPre?3000:enrolData.level==='4.ª classe'?3000:2800,monthly=base+(enrolData.extra?1000:0)+(enrolData.lunch?1500:0),id='new'+Date.now();let np={id,name,number:(isPre?'NV-P-':'NV-')+'2027-00'+(pupils.length+1),class:enrolData.level,entity:enrolData.entity,age:'—',status:'Activo',balance:5800,guardian:'Encarregado por preencher',phone:'—',services:['Mensalidade',...(enrolData.extra?['Extraclasse']:[]),...(enrolData.lunch?['Almoço']:[])],monthly,initials:name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(),alert:'Sem restrições de saúde registadas.',neighbourhood:'—',sex:'—'};pupils.unshift(np);entity=enrolData.entity;$$('.entity-btn').forEach(b=>b.classList.toggle('selected',b.dataset.entity===entity));toast('Matrícula de '+name+' confirmada.');if(pay){navigate('dashboard');openPayment(id);}else navigate('matriculas')}

function openGuardian(){navigate('guardian-profile')}
function openUserMenu(){openModal('Conta do utilizador','Ana Mucavele · Administradora',`<div class="listrow"><div><strong>Perfil e preferências</strong><small>Dados de acesso e idioma</small></div><button class="btn btn-secondary btn-sm" onclick="closeModal();navigate('configuracoes')">Abrir</button></div><div class="listrow"><div><strong>Terminar sessão</strong><small>Voltar ao ecrã de acesso</small></div><button class="btn btn-danger btn-sm" onclick="closeModal();navigate('login')">Sair</button></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Fechar</button>`);}
function login(){return `<div style="max-width:430px;margin:45px auto"><div class="card panel-pad" style="padding:30px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:24px"><div class="brandmark"><svg viewBox="0 0 40 34" fill="none"><path d="M3 7.5C9 5 14.4 6.1 20 10v20c-5.6-3.9-11-5-17-2.5V7.5Z" fill="#2D6AA8"/><path d="M37 7.5C31 5 25.6 6.1 20 10v20c5.6-3.9 11-5 17-2.5V7.5Z" fill="#E9B936"/></svg></div><div><div style="font-size:19px;font-weight:850;color:#1c3c62">Nova Vida</div><div class="section-note">School Management System</div></div></div><h2 style="font-size:20px;color:#223d5b;margin:0 0 5px">Bem-vindo de volta</h2><p class="subtitle" style="margin:0 0 20px">Entre com as suas credenciais para continuar.</p><div class="field"><label>Email ou telefone</label><input placeholder="nome@novavida.co.mz / 84 000 0000"></div><div class="field" style="margin-top:13px"><label>Palavra-passe</label><input type="password" placeholder="Introduza a palavra-passe"></div><div style="text-align:right;margin:10px 0 17px"><button class="linkbtn" onclick="toast('Instruções de recuperação enviadas (demonstração).')">Esqueceu-se da palavra-passe?</button></div><button class="btn btn-primary" style="width:100%;padding:12px" onclick="navigate('dashboard');toast('Sessão iniciada (demonstração).')">Entrar →</button><div class="section-note" style="text-align:center;margin-top:18px">Educando para a Eternidade</div></div></div>`;}
function openPrint(type,id){printType=type;let p=pupils.find(x=>x.id===id)||pupils[0],doc='';let selectedPay=type==='receipt'?(String(id||'').startsWith('REC-')?payments.find(x=>x.receipt===id):[...payments].reverse().find(x=>x.pupil===p.name)):null;if(selectedPay){p=pupils.find(x=>x.name===selectedPay.pupil)||p;}let company=p.entity==='Primary'?'Escola Primária Nova Vida, SU, Lda.':'Jardim Infantil Nova Vida';let title=type==='receipt'?'RECIBO':type==='statement'?'EXTRATO ANUAL':'FICHA DE MATRÍCULA';let receiptNo=selectedPay?.receipt||'REC-2027-00418';if(type==='receipt'){let pay=selectedPay||payments[0];doc=`<div class="print-grid"><div><b>N.º do recibo:</b> ${receiptNo}</div><div><b>Data:</b> ${pay.date||'10/05/2027'}</div><div><b>Aluno:</b> ${pay.pupil||p.name}</div><div><b>Encarregado:</b> ${pay.guardian||p.guardian}</div><div><b>Turma:</b> ${p.class}</div><div><b>Empresa:</b> ${company}</div></div><table class="print-table"><thead><tr><th>Descrição / item liquidado</th><th>Referência</th><th>Valor</th></tr></thead><tbody><tr><td>Pagamento por conta · mensalidades em aberto</td><td>${pay.reference||'—'}</td><td>${money(pay.amount||3000)}</td></tr></tbody></table><div class="print-total">Total recebido: ${money(pay.amount||3000)}</div><div class="print-grid"><div><b>Método:</b> ${pay.method||'Numerário'}</div><div><b>Conta:</b> ${pay.account||'Caixa da secretaria'}</div><div><b>Recebido por:</b> ${pay.received||'Ana Mucavele'}</div><div><b>Saldo após pagamento:</b> ${money(p.balance)}</div></div><div style="margin-top:32px;display:flex;justify-content:space-between;font-size:9px"><span>Assinatura / carimbo</span><span>________________________________</span></div>`;}
if(type==='statement'){doc=`<div class="print-grid"><div><b>Aluno:</b> ${p.name}</div><div><b>N.º:</b> ${p.number}</div><div><b>Encarregado:</b> ${p.guardian}</div><div><b>Telefone:</b> ${p.phone}</div><div><b>Turma:</b> ${p.class}</div><div><b>Ano lectivo:</b> ${year}</div><div><b>Serviços:</b> ${p.services.join(', ')}</div><div><b>Total mensal:</b> ${money(p.monthly)}</div></div><h3 style="font-size:11px;margin-top:16px">Controlo mensal de pagamentos</h3><table class="print-table"><thead><tr><th>Mês</th><th>Vencimento</th><th>Valor devido</th><th>Data de pagamento</th><th>Multa</th><th>Desconto</th><th>Pago</th><th>Saldo</th></tr></thead><tbody>${monthNames.map((m,i)=>`<tr><td>${m}</td><td>05/${String(i+2).padStart(2,'0')}/2027</td><td>${money(p.monthly)}</td><td>${i<3?'10/'+String(i+2).padStart(2,'0')+'/2027':'—'}</td><td>${i===4?money(265):'—'}</td><td>—</td><td>${i<3?money(p.monthly):i===3&&p.id==='lucia'?money(3000):'—'}</td><td>${i<3?money(0):money(i===3&&p.id==='lucia'?p.monthly-3000:p.monthly+(i===4?265:0))}</td></tr>`).join('')}</tbody></table><h3 style="font-size:11px;margin-top:14px">Resumo anual por serviço</h3><table class="print-table"><thead><tr><th>Serviço</th><th>Valor mensal</th><th>N.º meses</th><th>Total anual</th></tr></thead><tbody>${p.services.map(s=>{let v=s==='Mensalidade'?p.monthly-(p.services.includes('Extraclasse')?1000:0)-(p.services.includes('Almoço')?1500:0):s==='Extraclasse'?1000:1500;return `<tr><td>${s}</td><td>${money(v)}</td><td>10</td><td>${money(v*10)}</td></tr>`}).join('')}</tbody></table><div class="print-total">Saldo actual: ${money(p.balance)}</div><div style="font-size:9px;line-height:1.7">Pagamentos: Millennium BIM · M-Pesa · e-Mola · Numerário</div>`;}
if(type==='enrolment'){doc=`<div class="print-grid"><div><b>Nome do aluno:</b> ${p.name}</div><div><b>N.º do aluno:</b> ${p.number}</div><div><b>Data de nascimento:</b> 14/08/2018</div><div><b>Sexo:</b> ${p.sex}</div><div><b>Bairro:</b> ${p.neighbourhood}</div><div><b>Turma:</b> ${p.class}</div><div><b>Encarregado:</b> ${p.guardian}</div><div><b>Contacto:</b> ${p.phone}</div></div><h3 style="font-size:11px">Serviços contratados</h3><p style="font-size:10px">${p.services.join(' · ')} · Total mensal: ${money(p.monthly)}</p><h3 style="font-size:11px">Saúde e emergência</h3><p style="font-size:10px">Registos de saúde e restrições alimentares: consultar a ficha individual do aluno.</p><h3 style="font-size:11px">Consentimentos</h3><p style="font-size:10px">☐ Uso de imagem nas redes sociais &nbsp;&nbsp; ☑ 10 mensalidades &nbsp;&nbsp; ☑ Uniforme e livros &nbsp;&nbsp; ☐ Tratamento de emergência</p><div style="display:flex;justify-content:space-between;margin-top:44px;font-size:9px"><span>Assinatura do encarregado: _____________________</span><span>Data: ____/____/________</span></div>`;}
let html=`<div class="print-paper"><div class="print-head"><div class="print-brand"><div class="brandmark"><svg viewBox="0 0 40 34" fill="none"><path d="M3 7.5C9 5 14.4 6.1 20 10v20c-5.6-3.9-11-5-17-2.5V7.5Z" fill="#2D6AA8"/><path d="M37 7.5C31 5 25.6 6.1 20 10v20c5.6-3.9 11-5 17-2.5V7.5Z" fill="#E9B936"/><path d="M20 10v20" stroke="#fff" stroke-width="1.4"/></svg></div><div><strong>Nova Vida</strong><small>${p.entity==='Primary'?'Educando para a Eternidade':'Educar nossas crianças para uma Vida Nova'}</small></div></div><div class="print-company"><b>${company}</b><br> Cidade de Xai-Xai · Gaza · Moçambique<br>NUIT: 400123456</div></div><h2>${title}</h2>${doc}<div class="print-footer">${p.entity==='Primary'?'Educando para a Eternidade':'Educar nossas crianças para uma Vida Nova'} · Documento emitido pelo Nova Vida SMS</div></div>`;openModal(title,'Pré-visualização para impressão A4',html,`<button class="btn btn-secondary" onclick="closeModal()">Fechar</button><button class="btn btn-primary" onclick="window.print()">Imprimir / Guardar PDF</button>`);$('#modal').classList.add('printing');}
// Navigation and global controls
$$('.navitem').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
$$('.entity-btn').forEach(b=>b.addEventListener('click',()=>{$$('.entity-btn').forEach(x=>x.classList.toggle('selected',x===b));entity=b.dataset.entity;render();}));
$('#yearSelect').addEventListener('change',e=>{year=e.target.value;render();});$('#quickPayment').addEventListener('click',()=>openPayment());$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();let p=pupils.find(p=>(p.name+' '+p.number+' '+p.guardian).toLowerCase().includes(q));if(p){profileId=p.id;navigate('perfil');}else if(q.includes('rec'))navigate('documentos');else toast('Não foram encontrados resultados.');}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus();}if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('open')}});
function openGuardianAt(){navigate('guardian-profile')}
render();
</script>
</body>
</html>
